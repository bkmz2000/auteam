<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        backend: {
          name: 'github',
          repo: 'bkmz2000/auteam',
          branch: 'main',
          base_url: 'https://billowing-dawn-a92d.bkmz2000.workers.dev',
          auth_endpoint: '/api/auth'
        },
        local_backend: false,
        media_folder: 'src/assets/images',
        public_folder: 'src/assets/images',
        editor: {
          default_editor: 'visual'
        },
        collections: [
          {
            name: 'posts',
            label: 'Posts',
            folder: 'content/posts',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Slug', name: 'slug', widget: 'string' },
              { label: 'Publish Date', name: 'date', widget: 'datetime' },
              { label: 'Body', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'news',
            label: 'News',
            folder: 'content/news',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Slug', name: 'slug', widget: 'string' },
              { label: 'Date', name: 'date', widget: 'datetime' },
              { label: 'Content', name: 'content', widget: 'markdown' },
              { label: 'Language', name: 'language', widget: 'select', multiple: true, options: ['russian', 'english', 'armenian'] }
            ]
          },
          {
            name: 'categories',
            label: 'Categories',
            folder: 'content/categories',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Name', name: 'name', widget: 'string' },
              { label: 'Slug', name: 'slug', widget: 'string' },
              { label: 'Description', name: 'description', widget: 'markdown' },
              { label: 'Age Group', name: 'ageGroup', widget: 'select', multiple: true, options: ['children', 'teens', 'adults'] },
              { label: 'Language', name: 'language', widget: 'select', multiple: true, options: ['russian', 'english', 'armenian'] },
              { label: 'Order', name: 'order', widget: 'number' }
            ]
          },
          {
            name: 'courses',
            label: 'Courses',
            folder: 'content/courses',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Name', name: 'name', widget: 'string' },
              { label: 'Slug', name: 'slug', widget: 'string' },
              { label: 'Description', name: 'description', widget: 'markdown' },
              { label: 'Price (RUB)', name: 'priceRub', widget: 'number' },
              { label: 'Price (AMD)', name: 'priceDram', widget: 'number' },
              { label: 'Duration', name: 'duration', widget: 'string' },
              { label: 'Age Group', name: 'ageGroup', widget: 'select', multiple: true, options: ['children', 'teens', 'adults'] },
              { label: 'Language', name: 'language', widget: 'select', multiple: true, options: ['russian', 'english', 'armenian'] },
              { label: 'Category', name: 'category', widget: 'string' },
              { label: 'Sign Up URL', name: 'signUpUrl', widget: 'string' },
              { label: 'Is Active', name: 'isActive', widget: 'boolean' }
            ]
          },
          {
            name: 'feedback',
            label: 'Feedback',
            folder: 'content/feedback',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Author', name: 'author', widget: 'string' },
              { label: 'Content', name: 'content', widget: 'markdown' },
              { label: 'Date', name: 'date', widget: 'datetime' }
            ]
          },
          {
            name: 'pages',
            label: 'Pages',
            folder: 'content/pages',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Slug', name: 'slug', widget: 'string' },
              { label: 'Content', name: 'content', widget: 'markdown' }
            ]
          },
          {
            name: 'settings',
            label: 'Settings',
            folder: 'content/settings',
            create: false,
            slug: 'site',
            fields: [
              { label: 'Organization Name', name: 'organizationName', widget: 'string' },
              { label: 'Mission', name: 'mission', widget: 'markdown' },
              { label: 'Payment Info', name: 'paymentInfo', widget: 'markdown' },
              { label: 'Ethics Guidelines', name: 'ethicsGuidelines', widget: 'markdown' },
              { label: 'Contact Email', name: 'contactEmail', widget: 'string' },
              { label: 'Contact Phones', name: 'contactPhones', widget: 'list', fields: [{ label: 'Phone', name: 'phone', widget: 'string' }] },
              { label: 'Social Links', name: 'socialLinks', widget: 'object', fields: [
                { label: 'VK', name: 'vk', widget: 'string' },
                { label: 'WhatsApp', name: 'whatsapp', widget: 'string' },
                { label: 'Telegram', name: 'telegram', widget: 'string' }
              ]}
            ]
          }
        ]
      });
    </script>
  </body>
</html>
